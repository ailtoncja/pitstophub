name: Send race result notifications

on:
  schedule:
    # A cada 15min, 24/7 -- bem mais barato que o sync completo (1x/dia) porque
    # check-recent-results.mjs so re-consulta corridas especificas que ja
    # deviam ter acabado, nao a temporada inteira das 9 categorias. Na maioria
    # das execucoes nao ha corrida nenhuma pra checar (0 requests extras).
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # Atualiza o status/vencedor de corridas que a gente ainda tinha como
      # "upcoming" mas cuja data ja chegou, ANTES de checar quem notificar --
      # sem isso, o resultado so aparece como "completed" no proximo sync
      # completo do dia seguinte (scripts/sync-thesportsdb.mjs).
      - run: node scripts/check-recent-results.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}

      - run: npx tsx scripts/send-result-notifications.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
